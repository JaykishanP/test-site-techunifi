name: Update Techunifi News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Zoho News
        run: |
          curl -L \
          "https://sheet.zoho.com/sheet/publishedsheet/ef7cde9d861a5551767f66e7b0071335909a777bae6ce280f4ec8f938c38dcdf?type=grid&download=csv" \
          -o zoho-news.csv

      - name: Convert CSV to JSON
        run: |
          python - <<'PY'
          import csv
          import json

          with open("zoho-news.csv", "r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              data = list(reader)

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("News records:", len(data))
          PY

      - name: Commit updated news
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          git diff --cached --quiet || \
          git commit -m "Update news from Zoho Sheet"

          git push
